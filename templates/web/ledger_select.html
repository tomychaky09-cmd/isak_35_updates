{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Buku Besar - Pilih Akun</h1>
</div>

<div class="row">
    {% for type in ['Asset', 'Liability', 'Asset Net', 'Revenue', 'Expense'] %}
    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card shadow-sm h-100 border-0" style="border-radius: 15px;">
            <div class="card-header bg-dark text-white py-3">
                <h6 class="mb-0">{{ type.upper() }}</h6>
            </div>
            <div class="list-group list-group-flush overflow-auto" style="max-height: 300px;">
                {% for acc in accounts if acc[3] == type %}
                <a href="/ledger/{{ acc[0] }}" class="list-group-item list-group-item-action">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <small class="text-muted d-block">{{ acc[1] }}</small>
                            <strong>{{ acc[2] }}</strong>
                        </div>
                        <i class="fas fa-chevron-right text-muted small"></i>
                    </div>
                </a>
                {% endfor %}
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
