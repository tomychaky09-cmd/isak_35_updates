{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Daftar Akun (Chart of Accounts)</h1>
    <a href="/coa/add" class="btn btn-primary"><i class="fas fa-plus me-1"></i>Tambah Akun</a>
</div>

<div class="card shadow-sm border-0" style="border-radius: 15px;">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Kode</th>
                        <th>Nama Akun</th>
                        <th>Tipe</th>
                        <th>Kategori</th>
                        <th>Catatan</th>
                        <th class="text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    {% for acc in accounts %}
                    <tr>
                        <td><strong>{{ acc[1] }}</strong></td>
                        <td>{{ acc[2] }}</td>
                        <td><span class="badge bg-info text-dark">{{ acc[3] }}</span></td>
                        <td>{{ acc[4] }}</td>
                        <td class="small">{{ acc[5] or '-' }}</td>
                        <td class="text-center">
                            <div class="btn-group">
                                <a href="/coa/edit/{{ acc[0] }}" class="btn btn-sm btn-outline-warning" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <button type="button" class="btn btn-sm btn-outline-danger" title="Hapus" 
                                        onclick="if(confirm('Hapus akun {{ acc[2] }}? Peringatan: Akun yang sudah digunakan di jurnal tidak bisa dihapus.')) window.location.href='/coa/delete/{{ acc[0] }}'">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
