{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Daftar Jurnal Umum</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group me-2">
            <a href="{{ url_for('export_journals') }}" class="btn btn-sm btn-outline-success"><i class="fas fa-file-excel me-1"></i>Ekspor ke Excel</a>
            <a href="{{ url_for('add_journal') }}" class="btn btn-sm btn-primary"><i class="fas fa-plus me-1"></i>Tambah Jurnal</a>
        </div>
    </div>
</div>

<div class="card shadow-sm border-0" style="border-radius: 15px;">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Tanggal</th>
                        <th>No. Referensi</th>
                        <th>Keterangan</th>
                        <th class="text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    {% for j in journals %}
                    <tr>
                        <td>{{ j.date }}</td>
                        <td><code>{{ j.reference_no or '-' }}</code></td>
                        <td>{{ j.description }}</td>
                        <td class="text-center">
                            <div class="btn-group">
                                <a href="{{ url_for('journal_detail', jid=j.id) }}" class="btn btn-sm btn-outline-primary" title="Detail">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a href="{{ url_for('edit_journal', jid=j.id) }}" class="btn btn-sm btn-outline-warning" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <button type="button" class="btn btn-sm btn-outline-danger" title="Hapus" 
                                        onclick="if(confirm('Hapus jurnal ini?')) window.location.href='{{ url_for('delete_journal', jid=j.id) }}'">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center text-muted py-4">Belum ada transaksi jurnal.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
