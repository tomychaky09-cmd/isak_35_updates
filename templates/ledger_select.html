{% extends "base.html" %}

{% block content %}
<div class="pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Buku Besar</h1>
    <p class="text-muted">Pilih akun di bawah untuk melihat detail transaksi.</p>
</div>

<div class="row">
    {% for acc in accounts %}
    <div class="col-md-6 mb-3">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-1"><strong>{{ acc.code }}</strong> - {{ acc.name }}</h6>
                    <span class="badge bg-light text-dark border">{{ acc.type }}</span>
                </div>
                <a href="{{ url_for('ledger_detail', aid=acc.id) }}" class="btn btn-primary btn-sm">
                    <i class="fas fa-search me-1"></i> Lihat
                </a>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12">
        <p class="text-muted">Belum ada akun yang tersedia.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
